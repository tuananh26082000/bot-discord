<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Discord Bot Controller</title>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system; margin: 16px; }
        .row { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
        input { padding: 6px; font-size: 14px; }
        label { font-weight:600; }
        button { padding: 10px 16px; font-weight:600; cursor:pointer; }
        #logs { background:#0b1020; color:#cde3ff; height: 240px; overflow:auto; padding:10px; border-radius:8px; }
        table { border-collapse: collapse; width:100%; margin-top:12px; }
        table th, table td { border:1px solid #ccc; padding:6px; text-align:center; }
    </style>
</head>
<body>
<h1>Discord Bot Controller</h1>

<div class="row">
    <label>Default Width</label>
    <input id="defW" type="number" value="300" style="width:80px"/>
    <label>Default Height</label>
    <input id="defH" type="number" value="200" style="width:80px"/>
</div>

<table id="accTable">
    <thead><tr><th>Account</th><th>X</th><th>Y</th><th>Width</th><th>Height</th></tr></thead>
    <tbody>
    <tr><td>A1</td><td><input id="xA1" type="number" style="width:80px"></td><td><input id="yA1" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    <tr><td>A2</td><td><input id="xA2" type="number" style="width:80px"></td><td><input id="yA2" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    <tr><td>B1</td><td><input id="xB1" type="number" style="width:80px"></td><td><input id="yB1" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    <tr><td>B2</td><td><input id="xB2" type="number" style="width:80px"></td><td><input id="yB2" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    <tr><td>C1</td><td><input id="xC1" type="number" style="width:80px"></td><td><input id="yC1" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    <tr><td>C2</td><td><input id="xC2" type="number" style="width:80px"></td><td><input id="yC2" type="number" style="width:80px"></td><td class="w">300</td><td class="h">200</td></tr>
    </tbody>
</table>

<div class="row">
    <button id="save">Save Config</button>
    <button id="start">Start Bot</button>
    <button id="stop">Stop Bot</button>
</div>

<h2>Logs</h2>
<pre id="logs"></pre>

<script>
    const $ = (id) => document.getElementById(id);

    function appendLog(msg){
        const el = $('logs');
        el.textContent += msg + (msg.endsWith('\n')?'':'\n');
        el.scrollTop = el.scrollHeight;
    }

    bridge.onLog((msg)=>appendLog(msg));

    $('defW').oninput = updateWH;
    $('defH').oninput = updateWH;

    function updateWH(){
        document.querySelectorAll("#accTable td.w").forEach(td => td.textContent = $('defW').value);
        document.querySelectorAll("#accTable td.h").forEach(td => td.textContent = $('defH').value);
    }
    updateWH();

    $('save').onclick = async () => {
        try {
            const accounts = {};
            ['A1','A2','B1','B2','C1','C2'].forEach(name=>{
                accounts[name] = {
                    x:Number($('x'+name).value)||0,
                    y:Number($('y'+name).value)||0,
                    w:Number($('defW').value),
                    h:Number($('defH').value)
                };
            });
            const res = await bridge.saveConfig({ accounts });
            appendLog(res.ok ? '✅ Saved accounts.json' : '❌ Save failed');
        } catch (e) {
            appendLog('❌ Error saving accounts');
        }
    };

    $('start').onclick = async () => {
        const res = await bridge.startBot();
        appendLog(res.ok ? '🚀 Bot starting…' : '❌ ' + (res.message||'Start failed'));
    };

    $('stop').onclick = async () => {
        const res = await bridge.stopBot();
        appendLog(res.ok ? '🛑 Bot stopped' : 'ℹ️ ' + (res.message||''));
    };
</script>
</body>
</html>
